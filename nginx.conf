server {
    listen 80;
    server_name _;

    # Cloudflare reuses connections to your origin for ~90 seconds.
    # nginx's default keepalive_timeout is 65s — it closes idle connections
    # before Cloudflare's reuse window expires, causing a race where Cloudflare
    # sends a request on a connection nginx already closed → 504.
    # Setting this to 120s means nginx keeps connections alive longer than
    # Cloudflare's pool will try to reuse them, eliminating the race.
    keepalive_timeout 120s;
    keepalive_requests 1000;

    root /usr/share/nginx/html;
    index index.html;

    # ── SPA fallback ─────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API proxy → backend ───────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Empty Connection header enables HTTP/1.1 keepalive to the upstream.
        # Without this nginx sends "Connection: close" on every request, forcing
        # uvicorn to tear down the TCP connection after each response.
        proxy_set_header   Connection        "";

        # Required for httpOnly cookie pass-through
        proxy_pass_header  Set-Cookie;

        # SSE support (job search stream)
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     300s;
        proxy_connect_timeout  75s;
        chunked_transfer_encoding on;
    }

    # ── Health + Swagger docs ──────────────────────────────────────────────────
    location ~ ^/(health|docs|openapi.json) {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_pass_header  Set-Cookie;
    }

    # ── Static asset caching ──────────────────────────────────────────────────
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
