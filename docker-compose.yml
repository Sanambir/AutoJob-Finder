version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: workfinderx-backend
    restart: unless-stopped
    environment:
      # Set all of these in Coolify's environment variable UI.
      # For local dev, create backend/.env and use env_file instead.
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - SECRET_KEY=${SECRET_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_EMAIL=${SMTP_EMAIL}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      - MATCH_THRESHOLD=${MATCH_THRESHOLD:-75}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - FRONTEND_URL=${FRONTEND_URL}
      - DB_PATH=/app/data/workfinderx.db
    volumes:
      - db_data:/app/data           # named volume — survives redeployments
    healthcheck:
      # Coolify uses this to decide when the new backend container is ready
      # before routing traffic to it. Keeps the old container alive until
      # the new one passes, eliminating the "no available server" gap.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - workfinderx

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: workfinderx-frontend
    restart: unless-stopped
    expose:
      - "80"                        # internal only — Coolify's Traefik routes to this
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Give nginx 30s to finish serving in-flight requests before Docker kills
    # it. Without this, Docker sends SIGKILL immediately on deploy and active
    # requests get dropped mid-response.
    stop_grace_period: 30s
    networks:
      - workfinderx

volumes:
  db_data:                          # named volume for SQLite persistence

networks:
  workfinderx:
    driver: bridge
